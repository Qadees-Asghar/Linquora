<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient</title>
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>
  <header>
    <h1>Patient Registration</h1>
    <nav>
      <a href="../index.html">Back to Home</a>
    </nav>
  </header>
  <div class="container">
    <div class="title">Start Registration</div>
    <div class="content">

      <form id="patientForm">
        <div class="user-details">
          <div class="input-box">
            <span class="details">Patient Name</span>
            <input type="text" placeholder="Enter your name" required name="patientname">
          </div>

          <div class="input-box">
            <span class="details">Age</span>
            <input type="text" placeholder="Enter your age" required name="age">
          </div>

          <div class="input-box">
            <span class="details">Gender</span>
            <input type="text" placeholder="Enter your gender" required name="gender">
          </div>

          <div class="input-box">
            <span class="details">CNIC ID</span>
            <input type="text" placeholder="Enter your CNIC" required name="cnicid">
          </div>

          <div class="input-box">
            <span class="details">Guardian Name</span>
            <input type="text" placeholder="Enter your guardian name" requited name="guardianname">
          </div>

          <div class="input-box">
            <span class="details">Mobile Number</span>
            <input type="text" placeholder="Enter your mobile number " required name="mobilenumber">
          </div>

          <div class="input-box">
            <span class="details">Emergency Contact</span>
            <input type="text" placeholder="Enter your emergency contact" required name="contact">
          </div>

          <div class="input-box">
            <span class="details">Email</span>
            <input type="text" placeholder="Enter your email" required name="email">
          </div>

          <div class="input-box">
            <span class="detial">Home Address</span>
            <input type="text" placeholder="Enter your address" required name="homeaddress">
          </div>

          <div class="input-box">
            <span class="details">Blood Group</span>
            <input type="text" placeholder="Enter your blood group" required name="bloodgroup">
          </div>

          <div class="input-box">
            <span class="details">Allergies</span>
            <input type="text" placeholder="Enter your allergies" required name="allergies">
          </div>

          <div class="input-box">
            <span class="details">Existing Diseses</span>
            <input type="text" placeholder="Enter your diseases" required name="diseses">
          </div>
          <div class="input-box">
            <span class="details">Password</span>
            <input type="password" placeholder="Enter your password" required name="password">
          </div>
        </div>
        <div class="button">
          <input type="submit" value="Register">
        </div>
      </form>
      <script>
        document.getElementById('patientForm').addEventListener('submit', function (e) {
          e.preventDefault();
          const formData = new FormData(e.target);
          const data = Object.fromEntries(formData.entries());
          const patients = JSON.parse(localStorage.getItem('patients') || '[]');
          if (patients.some(p => p.email === data.email || p.cnicid === data.cnicid)) {
            alert('Patient with this Email or CNIC already exists!');
            return;
          }
          patients.push(data);
          localStorage.setItem('patients', JSON.stringify(patients));
          alert('Patient Registered Successfully!');
          window.location.href = 'login.html';
        });
      </script>
</body>

</html>
